services:
  ndl-web:
    image: crisperfx/m3u-extra:latest
    container_name: ndl-web
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./settings:/settings
    environment:
      TZ: Europe/Brussels
      MAX_CONCURRENT: "3"
      SETTINGS_DIR: /settings
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      EXT_TOKEN: ${EXT_TOKEN:-}
    restart: unless-stopped
