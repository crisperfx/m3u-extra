<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title data-i18n="log.title">Log · Crisperfx Stream Studio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_version('style.css') }}">
</head>
<body class="log-page" data-job-id="{{ job_id }}">
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">▶</div>
      <div>
        <h1>Crisperfx <span>Stream Studio</span></h1>
        <p data-i18n="log.subtitle">Live log</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="language" class="lang-select" data-i18n-aria-label="language.label" aria-label="Taal">NL</button>
      <a class="back" href="/" data-i18n="action.back" data-i18n-title="action.back" title="Terug naar GUI">← Terug naar GUI</a>
    </div>
  </header>

  <main class="shell">
    <section class="panel log-panel">
      <div class="panel-head">
        <div>
          <span class="eyebrow" data-i18n="log.liveLog">Live log</span>
          <h2 id="jobTitle" data-i18n="log.loadingTask">Taak laden...</h2>
        </div>
        <div class="head-actions">
          <span id="log-status" class="chip" data-i18n="log.status">inactief</span>
          <button id="copyLog" class="btn subtle" data-i18n="action.copyLog">Kopieer log</button>
        </div>
      </div>
      <div class="status-strip">
        <span id="phase" class="phase">-</span>
        <div class="progress"><div id="progressBar"></div></div>
        <span id="progressText" class="progress-text">—</span>
      </div>
      <div id="jobStreams" class="streams-slot"></div>
      <div id="jobProgress" class="streams-slot"></div>
      <pre id="log" data-i18n="log.loadingLog">Log laden...</pre>
      <div class="toolbar">
        <label class="switch"><input type="checkbox" id="autoscroll" checked> <span data-i18n="log.follow">Log volgen</span></label>
        <button type="button" id="backToTop" class="btn subtle top-btn" data-i18n="action.top">↑ Boven</button>
      </div>
      <p id="error" class="error"></p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='i18n.js') }}?v={{ static_version('i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='streams.js') }}?v={{ static_version('streams.js') }}"></script>
  <script src="{{ url_for('static', filename='log.js') }}?v={{ static_version('log.js') }}"></script>
</body>
</html>
